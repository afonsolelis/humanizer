name: Problema na reescrita
description: Uma reescrita manteve um sinal, mudou o sentido, inventou um fato ou editou demais.
labels: ["bug"]
body:
  - type: dropdown
    id: problem
    attributes:
      label: O que deu errado
      options:
        - Um sinal sobreviveu à reescrita
        - A reescrita acrescentou ou perdeu um fato
        - A reescrita mudou um texto que estava bom
        - A reescrita trocou a variante do português ou o registro
        - Outra coisa
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Texto de entrada
      description: O texto que você deu ao Humanizador. Remova qualquer coisa privada.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Como você chamou
      description: O agente e o modelo que usou, e o seu prompt exato.
      placeholder: "Claude Code, Opus 5.5: /humanizador e depois colei o texto"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Saída
      description: O que o Humanizador devolveu.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que ele deveria ter feito
      description: Cite a frase errada e diga o que um autor cuidadoso escreveria. Informe o número do padrão se souber.
    validations:
      required: true
