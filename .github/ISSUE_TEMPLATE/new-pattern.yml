name: Sinal novo
description: Um sinal de escrita de IA em português que nenhum padrão atual pega.
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: Exemplo
      description: Texto real que mostra o sinal. Remova qualquer coisa privada.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: Como uma pessoa escreveria
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Por que nenhum padrão atual cobre isso
      description: Nomeie o padrão existente mais próximo e diga por que ele deixa isso passar. A maioria dos sinais novos cabe em um padrão existente.
    validations:
      required: true
